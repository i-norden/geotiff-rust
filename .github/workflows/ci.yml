name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check all targets and features
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy --no-self-update

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests with all features
        run: cargo test --workspace --all-features --locked

  no-default-features:
    name: No default features
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy --no-self-update

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test TIFF reader with no default features
        run: cargo test -p tiff-reader --no-default-features --locked

      - name: Test TIFF writer with no default features
        run: cargo test -p tiff-writer --no-default-features --locked

      - name: Test GeoTIFF reader with no default features
        run: cargo test -p geotiff-reader --no-default-features --locked

      - name: Test GeoTIFF reader with COG feature set (includes local)
        run: cargo test -p geotiff-reader --no-default-features --features cog --locked

      - name: Test GeoTIFF reader with async COG feature set
        run: cargo test -p geotiff-reader --no-default-features --features cog-async --locked

  wasm:
    name: wasm32 writer build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --target wasm32-unknown-unknown --no-self-update

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the GeoTIFF writer for wasm32
        run: cargo build -p geotiff-writer --target wasm32-unknown-unknown --all-features --locked

  corpus:
    name: Corpus sync
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy --no-self-update

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify corpus fixtures are up to date
        run: ./scripts/fetch-interoperability-corpus.sh --verify-only

      - name: Verify fuzz seeds
        run: |
          ./scripts/seed-fuzz-corpus.sh
          git diff --exit-code -- fuzz/corpus
          if [ -n "$(git status --short -- fuzz/corpus)" ]; then
            git status --short -- fuzz/corpus
            exit 1
          fi

  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fuzz_target: [tiff_open, geotiff_open]
    env:
      FUZZ_TIME: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable for cargo-fuzz
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Install Rust nightly
        run: rustup toolchain install nightly-2026-06-02 --profile minimal --component clippy --no-self-update

      - name: Cache cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-bin-v2-0.13.1-rust-1.85.0

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            rustup run 1.85.0 cargo install cargo-fuzz --version 0.13.1 --locked
          fi

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check fuzz targets
        run: rustup run nightly-2026-06-02 cargo check --manifest-path fuzz/Cargo.toml --bins --locked

      - name: Lint fuzz targets
        run: rustup run nightly-2026-06-02 cargo clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings

      - name: Build fuzz target
        working-directory: fuzz
        run: rustup run nightly-2026-06-02 cargo fuzz build ${{ matrix.fuzz_target }}

      - name: Run fuzz target
        working-directory: fuzz
        run: rustup run nightly-2026-06-02 cargo fuzz run ${{ matrix.fuzz_target }} corpus/${{ matrix.fuzz_target }} -- -max_total_time=${{ env.FUZZ_TIME }}

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.fuzz_target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
